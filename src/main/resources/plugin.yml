name: SHCustomBrush
version: '${project.version}'
main: org.Cry_Legende.sHCustomBrush.SHCustomBrush
api-version: '1.20'
author: Cry_Legende

commands:
  shcustombrush:
    description: Gérer les items custom du loot de brossage.
    usage: /shcustombrush <add|remove|list|reload>

permissions:
  shcustombrush.admin:
    description: Toute l'administration de SHCustomBrush
    default: op
    children:
      shcustombrush.admin.add: true
      shcustombrush.admin.remove: true
      shcustombrush.admin.list: true
      shcustombrush.admin.reload: true
  shcustombrush.admin.add:
    description: Ajouter l'objet en main à la table de loot
    default: op
  shcustombrush.admin.remove:
    description: Retirer une entrée de la table de loot
    default: op
  shcustombrush.admin.list:
    description: Lister la table de loot
    default: op
  shcustombrush.admin.reload:
    description: Recharger config.yml et messages.yml
    default: op
