name: SHCustomBrush
version: '${project.version}'
main: org.Cry_Legende.sHCustomBrush.SHCustomBrush
api-version: '1.20'
author: Cry_Legende

commands:
  shcustombrush:
    description: Ajouter des items custom au loot de brossage.
    usage: /shcustombrush add <nom_item>

permissions:
  shcustombrush.add:
    description: Permet d'ajouter des items à la table de loot
    default: op
